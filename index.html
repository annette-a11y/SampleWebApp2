<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🚀 Space Explorer****!</h1>
    <p>A tiny tour of the cosmos</p>
    <button id="loginBtn">Login Button</button>
  </header>

  <main>
    <section class="card">
      <h2>Random Space Fact</h2>
      <p id="fact-text">Click the button to learn something new about space!</p>
      <button id="fact-btn">New Fact</button>
      <button id="loginBtn">Login Button</button>
    </section>

    <section class="planets">
      <h2>The Planets</h2>
      <div class="planet-grid" id="planet-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Space Explorer</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
